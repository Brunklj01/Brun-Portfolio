<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;800&display=swap" rel="stylesheet">
<title>Brun — Sobre</title>
<link rel="stylesheet" href="../css/style.css">
<script>try{var go=sessionStorage.getItem("go");if((go||!sessionStorage.getItem("intro"))&&!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("intro-lock");if(go)document.documentElement.classList.add("arrive")}}catch(e){}</script>
</head>
<body data-base="../" data-page="brun">
<div class="intro" id="intro" aria-hidden="true"><div class="intro-text" id="intro-text"></div></div>
<main id="main">
  <section class="about" aria-labelledby="about-title">
    <div class="about-hero">
      <h1 class="title about-title reveal" id="about-title">Brun</h1>
      <div class="photo reveal" id="photo" role="img" aria-label="Fotografia de Brun" data-i18n-label="brun.photoLabel"><span data-i18n="brun.photo">Foto</span></div>
    </div>

    <div class="about-body">
    <div class="about-grid">
      <div class="about-side small reveal" style="--delay:.15s">
        <p data-i18n="brun.interests">Interesses<br><span class="muted">Tipografia, fotografia analógica, arquitetura, edição independente.</span></p>
        <p data-i18n="brun.area">Área<br><span class="muted">Design, edição, desenvolvimento web e 3D.</span></p>
      </div>
    </div>

    <div class="contact reveal">
      <a href="mailto:ola@brun.pt">ola@brun.pt</a>
    </div>
    </div>
  </section>
</main>
<script src="../scripts/dados.js"></script>
<script src="../scripts/intro.js"></script>
<script src="../scripts/i18n.js"></script>
<script src="../scripts/main.js"></script>
<script src="../scripts/cursor.js"></script>
</body>
</html>
